source_id: 1
source_name: "vnexpress"
display_name: "VnExpress"
channel_type: "rss"

domains:
  - "vnexpress.net"

rss_feeds:
  - "https://vnexpress.net/rss/khoa-hoc-cong-nghe.rss"

listing_urls:
  - "https://vnexpress.net/so-hoa/cong-nghe"

fetcher:
  type: "http"
  timeout: 20

parser:
  type: "declarative"

  selectors:
    title:
      - "h1.title-detail"
      - "meta[property='og:title']@content"

    author:
      - ".fck_detail p.Normal[style*='text-align:right'] strong" # Tên tác giả căn phải ở cuối bài (như Trọng Đạt)
      - ".fck_detail p.Normal[style*='text-align: right'] strong"
      - ".fck_detail p[style*='text-align:right']"
      - ".fck_detail p[style*='text-align: right']"
      - ".author_mail"
      - ".author"
      - ".author-name"
      - "p.author"
      - "meta[property='article:author']@content"
      - "meta[name='author']@content"

    published_at:
      - "meta[property='article:published_time']@content"
      - "time[datetime]@datetime"
      - "time.date[datetime]@datetime"
      - ".date"
      - ".header-content .date" # Bổ sung thêm vùng chứa ngày tháng trên VnExpress

    thumbnail_url:
      - "meta[property='og:image']@content"
      - "meta[itemprop='thumbnailUrl']@content"
      - "figure[itemprop='associatedMedia image'] meta[itemprop='url']@content" # Lấy url ảnh chính xác từ thẻ meta của hình
      - "article img@data-src" # Lấy data-src thay vì src do dính lazy-load
      - ".fig-picture img@data-src"

    content_paragraphs:
      - ".fck_detail p.description" # Lấy đoạn sapo mở đầu
      - ".fck_detail p.Normal"      # Chỉ lấy các thẻ p chứa nội dung chính xác, tránh lấy lan man
      - ".content_detail p"

  clean_rules:
    strip_elements:
      - "script"
      - "style"
      - "iframe"
      - "form"
      - "button"

      # Các thành phần không phải nội dung bài viết
      - ".box-common-category"
      - ".list-news-related"
      - ".box-interact"
      - ".box-related"
      - ".list-news"
      - ".list_link" # Bổ sung class này để xóa cục bài viết liên quan cuối bài
      - ".social"
      - ".social-box"
      - ".comment"
      - ".comment-box"

      # Quảng cáo
      - ".ads"
      - ".banner"
      - ".box-ads"

      # Tiêu đề bài viết (đã được bóc tách riêng ở metadata)
      - "h1.title-detail"
      - "h1"
      - ".title-detail"
      - ".title_news_detail"
      - ".title_news"

      # Tác giả bài viết (đã được bóc tách riêng ở metadata)
      - ".author_mail"
      - ".author"
      - ".author-name"
      - "p.author"
      - ".fck_detail p.Normal[style*='text-align:right']"
      - ".fck_detail p.Normal[style*='text-align: right']"
      - ".fck_detail p[style*='text-align:right']"
      - ".fck_detail p[style*='text-align: right']"