source_id: 203
source_name: "baotintuc"
display_name: "Báo Tin tức"
channel_type: "rss"
domains:
  - "baotintuc.vn"

rss_feeds:
  - "https://baotintuc.vn/rss/ai-1658.rss"

fetcher:
  type: "http"
  timeout: 20

parser:
  type: "declarative"
  selectors:
    title:
      - "h1"
      - "meta[property='og:title']@content"
    author:
    # Báo Tin tức / TTXVN
      - ".article__source .author .name"
      - ".article__source .author"
      - ".article__source"
      - "meta[name='author']@content"
      - "meta[property='article:author']@content"
      - "a[rel='author']"
      - ".author-name"
      - ".article-author"
      - ".author"
    published_at:
      - "meta[property='article:published_time']@content"
      - "time[datetime]@datetime"
      - ".date"
      - ".publish-date"
    thumbnail_url:
      - "meta[property='og:image']@content"
      - "article img@src"
    content_paragraphs:
      - ".article__body p"
      - ".zce-content-body p"
      - ".cms-body p"
      - "article p"
  clean_rules:
    strip_elements:
      - "script"
      - "style"
      - "iframe"
      - "form"
      - "button"
      - ".ads"
      - ".banner"
      - ".comment"
      - ".related"
      - ".share-box"
      - ".social-share"
      - ".box-share"
      - ".box-related"
      - ".related-news"
      - ".article__source"
      - ".article__tag"
      - ".rennab"
      - ".wrap-comment"
      - ".sda_middle"
      - "footer"
      - "header"
      - "nav"
